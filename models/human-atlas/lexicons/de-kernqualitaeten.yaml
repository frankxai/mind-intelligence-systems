# German Kernqualitäten Lexicon
# Human Atlas canonical draft. Generated from the German precision layer supplied for PR #13.
# Keep this file non-clinical: qualities are developmental vocabulary, not diagnostic claims.

id: human_atlas.lexicon.de_kernqualitaeten
status: canonical-draft
language: de
date: '2026-07-06'
scope: German core-quality precision layer for the Human Atlas; non-clinical, developmental, evidence-bound.
principle: German is treated here as a semantic precision layer, not a literal localization of English trait labels.
non_clinical_boundary:
- Do not infer diagnosis from a quality, pitfall, allergy, defense, or trauma-response term.
- Keep observation, interpretation, hypothesis, evidence, and decision separate.
- Use these terms as developmental vocabulary, not identity locks.
- Interpretation confidence must never exceed observation confidence.
ofman_quadrant_inference:
  shape: core_quality -> pitfall_when_exaggerated -> challenge_as_balancing_quality -> allergy_when_challenge_is_exaggerated_in_others
  rule: Every quality can generate a quadrant by overextension and counterbalance; generated quadrants must remain hypotheses until evidence is supplied.
  example_quadrants:
  - core_quality: entschlossen
    pitfall:
    - dominant
    - stur
    challenge:
    - geduldig
    - offen
    allergy:
    - passiv
    - unentschieden
  - core_quality: hilfsbereit
    pitfall:
    - aufopfernd
    - einmischend
    challenge:
    - autonom
    - abgrenzend
    allergy:
    - egoistisch
    - kalt
  - core_quality: sorgfältig
    pitfall:
    - perfektionistisch
    - langsam
    challenge:
    - pragmatisch
    allergy:
    - schlampig
    - nachlässig
  - core_quality: flexibel
    pitfall:
    - sprunghaft
    challenge:
    - konsequent
    allergy:
    - starr
    - dogmatisch
